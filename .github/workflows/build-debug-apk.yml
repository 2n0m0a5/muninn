name: Build Muninn APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUNINN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/muninn.jks"
            echo "MUNINN_KEYSTORE_FILE=$RUNNER_TEMP/muninn.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No MUNINN_KEYSTORE_BASE64 secret: this APK uses a throwaway key and cannot update an earlier install."
          fi

      - name: Build with Gradle
        env:
          MUNINN_KEYSTORE_PASSWORD: ${{ secrets.MUNINN_KEYSTORE_PASSWORD }}
          MUNINN_KEY_ALIAS: ${{ secrets.MUNINN_KEY_ALIAS }}
          MUNINN_KEY_PASSWORD: ${{ secrets.MUNINN_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muninn
          path: app/build/outputs/apk/release/*-release*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
